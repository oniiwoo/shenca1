<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>工作端</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="firebase.js"></script>
</head>

<body>

<div class="container">

<div class="card">

<div class="title">
工作端
</div>

<div class="subtitle">
活動名稱
</div>

<input id="eventName">

</div>

<div class="card">

<div class="subtitle">
目前叫號
</div>

<div
id="currentPreview"
class="big-number">
A001
</div>

<br>

<div class="subtitle">
叫號顏色
</div>

<input
type="color"
id="colorPicker">

</div>

<div class="card">

<button onclick="prevNumber()">
上一號
</button>

<button onclick="nextNumber()">
下一號
</button>

<button onclick="recallNumber()">
重叫一次
</button>

<button onclick="resetCurrent()">
重置叫號
</button>

</div>

<div class="card">

<button onclick="clearQueue()">
清空排隊
</button>

</div>

<div class="card">

<button onclick="openQueue()">
開放排隊
</button>

<button onclick="pauseQueue()">
暫停排隊
</button>

</div>

<div class="card">

<div class="subtitle">
結束活動訊息
</div>

<input id="endMessage">

<br><br>

<button onclick="endActivity()">
結束活動
</button>

</div>

<div class="card">

<div class="subtitle">
等待總人數
</div>

<div
class="waiting"
id="waitingCount">
0
</div>

</div>

<div class="card">

<div class="subtitle">
排隊清單
</div>

<div id="queueList"></div>

</div>

</div>

<script src="admin.js"></script>

</body>
</html>
