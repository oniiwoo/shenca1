<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>顯示端</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="firebase.js"></script>
</head>

<body>

<div id="endScreen" class="end-screen hidden">
<div id="endMessageText"></div>
</div>

<div id="mainContent">

<div class="container">

<div class="card">

<div
class="title"
id="eventName">
活動名稱
</div>

<div class="subtitle">
目前叫號
</div>

<div
id="currentNumber"
class="big-number">
A001
</div>

</div>

<div class="card">

<button onclick="openTakeNumber()">
我要取號
</button>

</div>

<div class="card">

<div class="subtitle">
您的號碼
</div>

<div
class="big-number"
id="myNumber">
-
</div>

<div
id="myStatus"
class="status-text">
</div>

<div id="retakeArea"></div>

</div>

<div class="card">

<div class="subtitle">
等待總人數
</div>

<div
id="waitingCount"
class="waiting">
0
</div>

</div>

</div>

</div>

<div
id="takeModal"
style="
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
justify-content:center;
align-items:center;
">

<div
style="
background:white;
padding:20px;
border-radius:16px;
width:320px;
">

<h2>預約人數</h2>

<input
type="number"
min="1"
max="10"
id="peopleInput"
placeholder="1~10">

<br><br>

<button onclick="submitNumber()">
送出
</button>

<button onclick="closeTakeNumber()">
取消
</button>

</div>

</div>

<script src="display.js"></script>

</body>
</html>
